<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mimimimi friends</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <img src="night-world.png" alt="" />
        <div class="heroText">
          <p>Friends Across Time</p>
          <h1>mimimimi friends</h1>
          <span>&#x6253;&#x5f00;&#x540c;&#x4e00;&#x4e2a;&#x94fe;&#x63a5;&#xff0c;&#x5c31;&#x80fd;&#x770b;&#x5230;&#x5927;&#x5bb6;&#x73b0;&#x5728;&#x5728;&#x54ea;&#x91cc;&#x3001;&#x60f3;&#x4e0d;&#x60f3;&#x804a;&#x5929;&#x3002;</span>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div>
            <h2>&#x66f4;&#x65b0;&#x6211;</h2>
            <p>&#x6bcf;&#x4e2a;&#x4eba;&#x586b;&#x81ea;&#x5df1;&#x7684;&#x72b6;&#x6001;&#xff0c;&#x5927;&#x5bb6;&#x90fd;&#x4f1a;&#x770b;&#x5230;&#x3002;</p>
          </div>
          <button id="refreshButton" type="button" class="ghostButton">&#x5237;&#x65b0;</button>
        </div>

        <form id="profileForm" class="profileForm">
          <label>
            &#x540d;&#x5b57;
            <input id="nameInput" required maxlength="24" placeholder="&#x6bd4;&#x5982; Alex" />
          </label>
          <label>
            &#x57ce;&#x5e02;
            <input id="cityInput" required maxlength="32" placeholder="&#x6bd4;&#x5982; Kunming" />
          </label>
          <label>
            &#x5730;&#x533a;
            <select id="zoneInput">
              <option value="America/Toronto">Canada / Toronto</option>
              <option value="America/New_York">USA / New York</option>
              <option value="America/Los_Angeles">USA / California</option>
              <option value="Asia/Shanghai">China / Kunming</option>
              <option value="Europe/London">UK / London</option>
              <option value="Europe/Paris">France / Paris</option>
              <option value="Asia/Tokyo">Japan / Tokyo</option>
              <option value="Australia/Sydney">Australia / Sydney</option>
            </select>
          </label>
          <label>
            &#x72b6;&#x6001;
            <input id="moodInput" maxlength="40" placeholder="&#x60f3;&#x804a;&#x5929; / &#x5fd9; / &#x7761;&#x4e86; / &#x51fa;&#x95e8;" />
          </label>
          <label>
            &#x65b9;&#x4fbf;&#x804a;&#x5929;
            <input id="windowInput" maxlength="24" placeholder="19:00-22:00" />
          </label>
          <label class="wide">
            &#x5c0f;&#x7eb8;&#x6761;
            <input id="noteInput" maxlength="90" placeholder="&#x7ed9;&#x670b;&#x53cb;&#x4eec;&#x7559;&#x4e00;&#x53e5;&#x8bdd;" />
          </label>

          <button type="submit" class="primaryButton">&#x4fdd;&#x5b58;&#x5e76;&#x540c;&#x6b65;</button>
        </form>
        <p id="statusText" class="statusText">&#x6b63;&#x5728;&#x8fde;&#x63a5; Supabase...</p>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div>
            <h2>&#x7559;&#x8a00;&#x5899;</h2>
            <p>&#x50cf;&#x5c0f;&#x7fa4;&#x804a;&#x4e00;&#x6837;&#xff0c;&#x4efb;&#x4f55;&#x4eba;&#x90fd;&#x53ef;&#x4ee5;&#x7559;&#x8bdd;&#x3002;</p>
          </div>
        </div>
        <form id="messageForm" class="messageForm">
          <input id="messageNameInput" maxlength="24" placeholder="&#x4f60;&#x7684;&#x540d;&#x5b57;" />
          <input id="messageInput" required maxlength="160" placeholder="&#x5199;&#x4e00;&#x53e5;&#x60f3;&#x8bf4;&#x7684;&#x8bdd;" />
          <button type="submit" class="primaryButton">&#x53d1;&#x9001;</button>
        </form>
        <div id="messagesList" class="messagesList"></div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div>
            <h2>&#x670b;&#x53cb;&#x4eec;</h2>
            <p><span id="friendCount">0</span> &#x4e2a;&#x670b;&#x53cb;&#xff0c;<span id="awakeCount">0</span> &#x4e2a;&#x53ef;&#x80fd;&#x5728;&#x7ebf;&#x3002;</p>
          </div>
          <span class="liveBadge" id="liveBadge">&#x540c;&#x6b65;&#x4e2d;</span>
        </div>
        <div id="friendsList" class="friendsList"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>朋友状态墙</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <img src="night-world.png" alt="" />
        <div class="heroText">
          <p>Friends Across Time</p>
          <h1>朋友状态墙</h1>
          <span>打开同一个链接，就能看到大家现在在哪个时区、想不想聊天。</span>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div>
            <h2>更新我</h2>
            <p>每个人填自己的状态，大家都会看到。</p>
          </div>
          <button id="refreshButton" type="button" class="ghostButton">刷新</button>
        </div>

        <form id="profileForm" class="profileForm">
          <label>
            名字
            <input id="nameInput" required maxlength="24" placeholder="比如 Alex" />
          </label>
          <label>
            城市
            <input id="cityInput" required maxlength="32" placeholder="比如 Kunming" />
          </label>
          <label>
            时区
            <select id="zoneInput">
              <option value="America/Toronto">Toronto / 多伦多</option>
              <option value="America/New_York">New York / 纽约</option>
              <option value="America/Los_Angeles">California / 加州</option>
              <option value="Asia/Shanghai">Kunming / 中国昆明</option>
              <option value="Europe/London">London / 伦敦</option>
              <option value="Europe/Paris">Paris / 巴黎</option>
              <option value="Asia/Tokyo">Tokyo / 东京</option>
              <option value="Australia/Sydney">Sydney / 悉尼</option>
            </select>
          </label>
          <label>
            状态
            <input id="moodInput" maxlength="40" placeholder="想聊天 / 忙 / 睡了 / 出门" />
          </label>
          <label>
            方便聊天
            <input id="windowInput" maxlength="24" placeholder="19:00-22:00" />
          </label>
          <label class="wide">
            小纸条
            <input id="noteInput" maxlength="90" placeholder="给朋友们留一句话" />
          </label>

          <button type="submit" class="primaryButton">保存并同步</button>
        </form>
        <p id="statusText" class="statusText">正在连接 Supabase...</p>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div>
            <h2>朋友们</h2>
            <p><span id="friendCount">0</span> 个朋友，<span id="awakeCount">0</span> 个可能在线。</p>
          </div>
          <span class="liveBadge" id="liveBadge">同步中</span>
        </div>
        <div id="friendsList" class="friendsList"></div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="app.js"></script>
  </body>
</html>

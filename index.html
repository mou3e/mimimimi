<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mimimimi</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0d14;
        --panel: #151a26;
        --line: rgba(255, 255, 255, 0.14);
        --text: #f5f0e8;
        --muted: #aeb7c8;
        --accent: #ffc56e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Arial, sans-serif;
        background:
          radial-gradient(circle at 18% 0%, rgba(255, 197, 110, 0.24), transparent 26rem),
          radial-gradient(circle at 90% 18%, rgba(97, 180, 255, 0.18), transparent 28rem),
          var(--bg);
        color: var(--text);
      }

      main {
        width: min(920px, calc(100% - 28px));
        margin: 0 auto;
        padding: 34px 0;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(34px, 10vw, 64px);
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
        margin-top: 28px;
      }

      a {
        display: block;
        min-height: 154px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(21, 26, 38, 0.88);
        color: var(--text);
        text-decoration: none;
        padding: 18px;
      }

      a:hover,
      a:focus-visible {
        border-color: var(--accent);
        outline: none;
      }

      strong {
        display: block;
        margin-bottom: 12px;
        font-size: 22px;
      }

      span {
        display: block;
        color: var(--muted);
        line-height: 1.5;
      }

      code {
        display: inline-block;
        margin-top: 14px;
        color: var(--accent);
        font-size: 13px;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mimimimi</h1>
      <p>一个入口，分别打开朋友时区和 AQF 页面。</p>

      <section class="grid" aria-label="网页链接">
        <a href="./friends.html">
          <strong>跨时区朋友小宇宙</strong>
          <span>朋友时区、状态、小纸条和在线时间。</span>
          <code>friends.html</code>
        </a>

        <a href="./corpus.html">
          <strong>AQF Corpus Demo</strong>
          <span>AQF 语料演示页面。</span>
          <code>corpus.html</code>
        </a>
      </section>
    </main>
  </body>
</html>
